<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganesh Hardware AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
padding:20px;
max-width:600px;
margin:auto;
}

input{
width:100%;
padding:15px;
font-size:18px;
border-radius:8px;
border:1px solid #ccc;
margin-top:20px;
}

button{
width:100%;
padding:15px;
font-size:20px;
background:#0d6efd;
color:white;
border:none;
border-radius:8px;
margin-top:15px;
cursor:pointer;
}

button:hover{
background:#0953c7;
}

#result{
margin-top:20px;
padding:20px;
background:white;
border-radius:10px;
font-size:20px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}
</style>

</head>

<body>

<header>
Ganesh Hardware AI
</header>

<div class="container">

<input id="searchBox" placeholder="Item Name likho">

<button onclick="searchItem()">
Search
</button>

<div id="result"></div>

</div>

<script>

const items={

"asian paint":"Asian Paint 20L\nPrice : ₹6500",

"putty":"JK Wall Putty 40kg\nPrice : ₹950",

"cement":"UltraTech Cement\nPrice : ₹420",

"pipe":"PVC Pipe 1 Inch\nPrice : ₹160",

"switch":"Anchor Switch\nPrice : ₹90",

"wire":"Finolex Wire 1.5 Sqmm\nPrice : ₹1250",

"fan":"Ceiling Fan\nPrice : ₹1800",

"led bulb":"LED Bulb 9W\nPrice : ₹85",

"socket":"Anchor Socket\nPrice : ₹120",

"mcb":"MCB 32A\nPrice : ₹320"

};

function searchItem(){

let item=document.getElementById("searchBox").value.toLowerCase().trim();

if(items[item]){

document.getElementById("result").innerHTML=items[item];

}else{

document.getElementById("result").innerHTML="Item Not Found";

}

}

</script>

</body>
</html>
