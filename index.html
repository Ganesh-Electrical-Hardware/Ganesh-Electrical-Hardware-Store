<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganesh Hardware</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f5f5f5;
}

header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:20px;
}

input{
width:100%;
padding:12px;
font-size:18px;
margin-bottom:20px;
}

button{
width:100%;
padding:12px;
font-size:18px;
background:#0d6efd;
color:white;
border:none;
border-radius:6px;
}

#result{
margin-top:20px;
background:white;
padding:15px;
border-radius:10px;
}
</style>
</head>

<body>

<header>
<h1>Ganesh Hardware AI</h1>
</header>

<div class="container">

<input id="search" placeholder="Item Name likho">

<button onclick="searchItem()">Search</button>

<div id="result"></div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbwheKG9A-KVFlgWOyjwXA7DnEeE92qr6LAL_2S-pY2bDsbzIWtb6yW2eRcQbtKy6wERhw/exec";

async function searchItem(){

let item=document.getElementById("search").value;

let res=await fetch(API+"?item="+encodeURIComponent(item));

let data=await res.text();

document.getElementById("result").innerHTML=data;

}

</script>

</body>
</html>
